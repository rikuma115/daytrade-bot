# Claude を使う実験（実験1: シグナルの見極め / 実験2: 開示を読んで銘柄選び）を GitHub 上で実行する。
# API キーは リポジトリの Settings → Secrets → ANTHROPIC_API_KEY に登録しておく（コードやログには出ない）。
# 答えは experiments/cache に保存してリポジトリに戻すので、同じ実験を再実行しても二重に課金されない。
name: experiment

# 起動のしかた: experiments/request.json を書き換えて push する（Claude が行う）か、Actions 画面から手動で実行する
on:
  push:
    branches: [main]
    paths: ["experiments/request.json"]
  workflow_dispatch:
    inputs:
      experiment:
        description: "exp1 または exp2"
        default: exp1
      model:
        description: "claude-haiku-5-5 / claude-sonnet-5-5 / claude-opus-5-5"
        default: claude-haiku-5-5
      budget:
        description: "この実行で使ってよい上限（ドル）"
        default: "10"

permissions:
  contents: write

concurrency:
  group: experiment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt anthropic
      - name: 実験の内容を決める（手動の入力 → なければ request.json）
        id: req
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          r = json.load(open("experiments/request.json"))
          inp = {"experiment": "${{ inputs.experiment }}", "model": "${{ inputs.model }}", "budget": "${{ inputs.budget }}"}
          for k in ("experiment", "model", "budget"):
              print(f"{k}={inp[k] or r[k]}")
          PY
      - name: 実験
        run: |
          case "${{ steps.req.outputs.experiment }}" in
            exp1) script=experiments/exp1_signals.py ;;
            exp2) script=experiments/exp2_disclosures.py ;;
            *) echo "exp1 か exp2 を指定してください"; exit 1 ;;
          esac
          python "$script" --model "${{ steps.req.outputs.model }}" --budget "${{ steps.req.outputs.budget }}" 2>&1 | tee "experiments/results/last_${{ steps.req.outputs.experiment }}_${{ steps.req.outputs.model }}.txt"
      - name: 結果を保存
        if: always()
        run: |
          git config user.name "daytrade-bot"
          git config user.email "daytrade-bot@users.noreply.github.com"
          git add experiments/cache experiments/results || true
          git diff --cached --quiet || git commit -m "experiment: ${{ steps.req.outputs.experiment }} ${{ steps.req.outputs.model }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: 完了を通知
        if: always()
        run: |
          python -m bot.notify "🧪 実験 ${{ steps.req.outputs.experiment }}（${{ steps.req.outputs.model }}）が終わりました（${{ job.status }}）"
