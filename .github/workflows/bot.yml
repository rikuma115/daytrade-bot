# 自動売買ボット（仮想の売買）を平日の取引時間に動かす。
#
# 起動のしかた（GitHub の予約起動は数時間遅れることがあるため、時間どおりに動く仕組みを合図にする）:
#   1. 毎朝 7:24 ごろ、Claude が朝の注目銘柄（picks/<日付>.json）を保存する → それを合図に前場の実行が始まる
#      （9:00 まで待機してから売買を始め、11:35 に終了）
#   2. 前場の実行が終わるときに、後場の実行を自分で起動する（12:30 まで待機して 15:40 に終了）
#   3. 予約起動（cron）は、1 が動かなかった日の予備。遅れて始まった場合は、その時点の時間帯から動く
# 1回の実行は最大6時間なので、前場と後場に分ける。状態と記録はリポジトリに保存し、後場が引き継ぐ。
name: bot

on:
  push:
    branches: [main]
    paths:                              # 朝の注目銘柄（寄り付き後の見直し .open.json では起動しない）
      - "picks/20*.json"
      - "!picks/*.open.json"
  schedule:
    - cron: "35 23 * * 0-4"   # 予備: 日本時間 平日 8:35
    - cron: "5 3 * * 1-5"     # 予備: 日本時間 平日 12:05
  workflow_dispatch:
    inputs:
      until:
        description: "終了する時刻（日本時間 HH:MM）"
        default: "15:40"

permissions:
  contents: write
  actions: write   # 前場の終わりに後場の実行を起動するため

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Tokyo
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 終了時刻を決める
        id: t
        run: |
          if [ -n "${{ github.event.inputs.until }}" ]; then u="${{ github.event.inputs.until }}";
          elif [ "$(date +%H%M)" -lt 1135 ]; then u="11:35";
          else u="15:40"; fi
          now=$(date +%H:%M)
          echo "until=$u" >> "$GITHUB_OUTPUT"
          if [[ "$u" > "15:30" ]]; then echo "after_close=true" >> "$GITHUB_OUTPUT"; else echo "after_close=false" >> "$GITHUB_OUTPUT"; fi
          # すでに終了時刻を過ぎている（予備の起動が遅れて来た、など）なら何もしない
          if [[ ! "$now" < "$u" ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
          echo "起動 $now（${{ github.event_name }}）→ $u まで"
      - name: 起動を通知
        if: steps.t.outputs.skip == 'false'
        run: |
          python -m bot.notify "▶ ボット起動 $(date +%H:%M)（$([ '${{ steps.t.outputs.until }}' = '11:35' ] && echo 前場 || echo 後場)・仮想）"
      - name: ボットを動かす
        if: steps.t.outputs.skip == 'false'
        run: python -m bot.run live --until "${{ steps.t.outputs.until }}"
      - name: 後場の実行を起動する（前場のあと）
        if: steps.t.outputs.skip == 'false' && steps.t.outputs.until == '11:35'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main -f until=15:40
      - name: 株価データを貯める（後場のあと）
        if: always() && steps.t.outputs.after_close == 'true' && steps.t.outputs.skip == 'false'
        run: python data.py || true
      - name: Claudeの注目銘柄の成績を集計して通知（後場のあと）
        if: always() && steps.t.outputs.after_close == 'true' && steps.t.outputs.skip == 'false'
        run: |
          msg=$(python -m morning.picks evaluate 2>/dev/null | grep -v "^$" || true)
          if [ -n "$msg" ]; then python -m bot.notify "$msg"; fi
      - name: 状態と記録を保存
        if: always() && steps.t.outputs.skip == 'false'
        run: |
          git config user.name "daytrade-bot"
          git config user.email "daytrade-bot@users.noreply.github.com"
          git add logs state data picks || true
          if git diff --cached --quiet; then echo "保存するものなし"; exit 0; fi
          git commit -m "bot: $(date '+%Y-%m-%d %H:%M') の記録"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then echo "保存しました"; exit 0; fi
            sleep $((i * 5))
          done
          echo "保存に失敗しました"; exit 1
      - name: 失敗したら通知
        if: failure()
        run: |
          python -m bot.notify "🚨 ボットの実行が失敗しました。GitHub の Actions 画面で確認してください。"
